{{- if .Values.console.enabled }}
{{- $fullName := include "holomatch.fullname" . }}
{{- $tlsSecret := .Values.console.gateway.tlsSecretName | default (printf "%s-console-tls" $fullName) }}
{{- if .Values.console.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}-console
  labels:
    {{- include "holomatch.labels" . | nindent 4 }}
  {{- if .Values.console.gateway.clusterIssuer }}
  annotations:
    # Requires cert-manager started with the ExperimentalGatewayAPISupport gate.
    cert-manager.io/cluster-issuer: {{ .Values.console.gateway.clusterIssuer }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.console.gateway.className }}
  listeners:
    - name: console
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.console.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.console.gateway.httpsRedirect }}
    - name: console-http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.console.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-console
  labels:
    {{- include "holomatch.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.console.gateway.create }}
    - name: {{ $fullName }}-console
      sectionName: console
    {{- else }}
    {{- toYaml .Values.console.parentRefs | nindent 4 }}
    {{- end }}
  hostnames:
    - {{ .Values.console.host | quote }}
  rules:
    - backendRefs:
        - name: {{ $fullName }}-console
          port: {{ .Values.console.port }}
{{- if and .Values.console.gateway.create .Values.console.gateway.httpsRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-console-redirect
  labels:
    {{- include "holomatch.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullName }}-console
      sectionName: console-http
  hostnames:
    - {{ .Values.console.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
