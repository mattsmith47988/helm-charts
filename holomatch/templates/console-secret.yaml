{{- if and .Values.console.enabled (not .Values.console.auth.existingSecret) }}
{{- $name := printf "%s-console-auth" (include "holomatch.fullname" .) }}
{{- $password := .Values.console.auth.password }}
{{- if not $password }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "holomatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
