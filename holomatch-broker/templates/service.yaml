apiVersion: v1
kind: Service
metadata:
  name: {{ include "holomatch-broker.fullname" . }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "holomatch-broker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
