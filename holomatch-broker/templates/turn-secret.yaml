{{- if not .Values.turn.existingSecret }}
{{- $name := include "holomatch-broker.turnSecretName" . }}
{{- $secret := .Values.turn.sharedSecret }}
{{- if not $secret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- if and $existing $existing.data (hasKey $existing.data "shared-secret") }}
{{- $secret = index $existing.data "shared-secret" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  shared-secret: {{ $secret | quote }}
{{- end }}
