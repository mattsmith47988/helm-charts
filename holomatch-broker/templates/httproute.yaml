apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "holomatch-broker.fullname" . }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: web
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "holomatch-broker.fullname" . }}
          port: 80
{{- if .Values.gateway.httpsRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "holomatch-broker.fullname" . }}-redirect
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: web-http
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
