{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
  {{- if .Values.gateway.clusterIssuer }}
  annotations:
    # Requires cert-manager with the ExperimentalGatewayAPISupport feature gate.
    cert-manager.io/cluster-issuer: {{ .Values.gateway.clusterIssuer }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: web
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.httpsRedirect }}
    - name: web-http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- if .Values.gateway.game.enabled }}
    - name: game
      protocol: UDP
      port: {{ .Values.gateway.game.port }}
      allowedRoutes:
        kinds:
          - kind: UDPRoute
    {{- end }}
{{- end }}
