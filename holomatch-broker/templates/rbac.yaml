apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "holomatch-broker.fullname" . }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
rules:
  # The broker creates and destroys one Pod + Service per player session.
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "holomatch-broker.fullname" . }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "holomatch-broker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "holomatch-broker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
