apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holomatch-broker.fullname" . }}
  labels:
    {{- include "holomatch-broker.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ .Values.broker.replicaCount }}
  selector:
    matchLabels:
      {{- include "holomatch-broker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: broker
  template:
    metadata:
      annotations:
        checksum/session-config: {{ include (print $.Template.BasePath "/session-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "holomatch-broker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: broker
    spec:
      serviceAccountName: {{ include "holomatch-broker.serviceAccountName" . }}
      containers:
        - name: broker
          image: "{{ .Values.broker.image.repository }}:{{ .Values.broker.image.tag }}"
          imagePullPolicy: {{ .Values.broker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "8080"
            - name: SESSION_IMAGE
              value: "{{ .Values.session.image.repository }}:{{ .Values.session.image.tag }}"
            - name: SESSION_IMAGE_PULL_POLICY
              value: {{ .Values.session.image.pullPolicy }}
            - name: SESSION_PORT
              value: "{{ .Values.session.port }}"
            - name: SESSION_ENV_FILE
              value: /etc/holomatch/session.env
            - name: SESSION_SHM_SIZE
              value: {{ .Values.session.shmSize }}
            - name: SESSION_CPU_REQUEST
              value: "{{ .Values.session.resources.requests.cpu }}"
            - name: SESSION_CPU_LIMIT
              value: "{{ .Values.session.resources.limits.cpu }}"
            - name: SESSION_MEM_REQUEST
              value: "{{ .Values.session.resources.requests.memory }}"
            - name: SESSION_MEM_LIMIT
              value: "{{ .Values.session.resources.limits.memory }}"
            - name: GAME_SERVER_HOST
              value: {{ include "holomatch-broker.gameServerHost" . | quote }}
            - name: GAME_SERVER_PORT
              value: "{{ .Values.gameServer.port }}"
            - name: MAX_SESSIONS
              value: "{{ .Values.broker.maxSessions }}"
            - name: SESSION_IDLE_TIMEOUT
              value: "{{ .Values.broker.idleTimeoutSeconds }}"
            - name: SESSION_MAX_LIFETIME
              value: "{{ .Values.broker.maxLifetimeSeconds }}"
            - name: SESSION_READY_TIMEOUT
              value: "{{ .Values.broker.readyTimeoutSeconds }}"
            {{- if or .Values.turn.coturn.enabled .Values.turn.externalHost }}
            - name: SESSION_TURN_SECRET_NAME
              value: {{ include "holomatch-broker.turnSecretName" . }}
            - name: SESSION_TURN_SECRET_KEY
              value: shared-secret
            {{- end }}
            {{- if .Values.broker.accessPassword }}
            - name: ACCESS_PASSWORD
              value: {{ .Values.broker.accessPassword | quote }}
            {{- end }}
          volumeMounts:
            - name: session-config
              mountPath: /etc/holomatch
          livenessProbe:
            httpGet:
              path: /_hm/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /_hm/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
      volumes:
        - name: session-config
          configMap:
            name: {{ include "holomatch-broker.fullname" . }}-session
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
